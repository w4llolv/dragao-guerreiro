<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#0b0c10">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dragão Guerreiro">

    <link rel="manifest" href="./manifest.json">

    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="./icon-192.png">

    <link rel="icon"
          type="image/png"
          sizes="512x512"
          href="./icon-512.png">

    <link rel="apple-touch-icon"
          href="./icon-192.png">

    <title>Dragão Guerreiro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #0b0c10;
            color: #edf5e1;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            border-radius: 35px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 10px;
            color: #66fcf1;
            font-size: 28px;
        }

        p {
            margin: 0 0 30px;
            color: #c5c6c7;
            line-height: 1.5;
        }

        .button {
            display: block;
            width: 100%;
            padding: 17px 20px;
            border-radius: 12px;
            background: #66fcf1;
            color: #0b0c10;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="logo"
            src="./icon-512.png"
            alt="Dragão Guerreiro">

        <h1>Dragão Guerreiro</h1>

        <p>
            Seu aplicativo pessoal de treinos.
        </p>

        <a
            class="button"
            href="https://script.google.com/macros/s/AKfycby69WviyJNQkAk0VNfX0aYpaUztkWyzXKJGzyIpHwJcqh5rP5GMHqqa_PZM7gfonefX/exec">
            Abrir aplicativo
        </a>

    </main>

</body>

</html>
